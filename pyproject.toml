[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agileops-ai"
version = "1.0.0"
description = "Multi-agent IT incident investigation and Agile delivery platform"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "fastapi",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pip-audit"
]
lab = [
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4"
]
ai = [
    "faiss-cpu>=1.10,<2",
    "sentence-transformers>=4,<6",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4"
]

[tool.setuptools.package-data]
agileops = ["runbooks/*.md", "assets/*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
