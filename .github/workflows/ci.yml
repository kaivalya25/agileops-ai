name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -e '.[dev,ai]'
      - name: Lint and check dependencies
        run: |
          python -m ruff check src tests
          python -m pip check
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Investigation evaluation
        run: |
          python -m agileops.evaluation > /tmp/evaluation.json
          python -c "import json; r=json.load(open('/tmp/evaluation.json')); assert r['count']==60 and r['summary']['agentic']['task_accuracy']==1"

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start the platform
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 480
      - name: Exercise the local model and portfolio demo
        run: |
          curl --fail --retry 3 http://127.0.0.1:8000/health
          curl --fail -H 'Content-Type: application/json' -d '{"question":"What CSV columns does the reporting connector require?","k":2}' http://127.0.0.1:8000/knowledge/ask
          docker compose exec -T api python -m agileops.demo --workspace /data --approve-lab > /tmp/demo.json
          python -c "import json; r=json.load(open('/tmp/demo.json')); assert r['workflow']['status']=='completed' and r['recovery']['status']=='completed'"
      - name: Collect Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the platform
        if: always()
        run: docker compose down
