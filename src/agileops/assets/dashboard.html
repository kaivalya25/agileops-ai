<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgileOps AI | Delivery dashboard</title>
<style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#182636;background:#f3f6f9}
*{box-sizing:border-box}
body{margin:0}
header{background:#102b45;color:white;padding:18px max(24px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px}
header strong{font-size:1.13rem;white-space:nowrap}
header a{color:#baddf7;font-size:.9rem;white-space:nowrap}
main{max-width:1210px;margin:auto;padding:38px 25px 64px}
h1{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.045em;margin:0 0 22px}
h2{font-size:1.08rem;margin:0 0 16px}
.metrics,.details{display:grid;gap:16px;margin-bottom:16px}
.metrics{grid-template-columns:repeat(auto-fit,minmax(172px,1fr))}
.details{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
section,.metric{background:white;border:1px solid #dbe5ed;border-radius:12px;padding:20px;min-width:0}
.label,th{color:#53677b;font-size:.85rem}
.value{margin-top:6px;font-size:1.8rem;font-variant-numeric:tabular-nums;font-weight:650}
.bar{display:grid;grid-template-columns:100px 1fr 28px;gap:10px;align-items:center;margin:12px 0;font-size:.85rem}
progress{width:100%;height:12px;accent-color:#216da6}
.table{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:.88rem;white-space:nowrap}
th,td{padding:11px 12px 11px 0;border-bottom:1px solid #e4edf4}
tbody tr:last-child td{border-bottom:0}
#status{color:#5c7184;font-size:.9rem}
</style>
</head>
<body>
<header><strong>AgileOps AI</strong><a href="/docs">API documentation</a></header>
<main>
  <h1>Delivery dashboard</h1>
  <p id="status" role="status">Loading portfolio…</p>
  <div class="metrics">
    <div class="metric"><div class="label">Completed tickets</div><div class="value" id="throughput">—</div></div>
    <div class="metric"><div class="label">Mean cycle time</div><div class="value" id="cycle">—</div></div>
    <div class="metric"><div class="label">Reopen rate</div><div class="value" id="reopen">—</div></div>
  </div>
  <div class="details">
    <section><h2>Tickets by status</h2><div id="bottlenecks"></div></section>
    <section class="table"><h2>Sprint performance</h2><table><thead><tr><th>Sprint</th><th>Planned dates</th><th>Completed</th></tr></thead><tbody id="sprints"></tbody></table></section>
  </div>
  <section class="table"><h2>Ticket aging</h2><table><thead><tr><th>Ticket</th><th>Status</th><th>Sprint</th><th>Age</th><th>Cycle time</th><th>Blocked time</th></tr></thead><tbody id="tickets"></tbody></table></section>
</main>
<script>
const byId = (id) => document.getElementById(id);
const label = (value) => value.replaceAll("_", " ");
function time(seconds) {
  if (seconds == null) return "—";
  if (seconds < 60) return `${seconds.toFixed(1)} s`;
  if (seconds < 3600) return `${(seconds / 60).toFixed(1)} min`;
  return `${(seconds / 3600).toFixed(1)} h`;
}
function row(table, values) {
  const entry = byId(table).insertRow();
  values.forEach(value => { entry.insertCell().textContent = value; });
}
async function load() {
  try {
    const response = await fetch("/bi/portfolio");
    if (!response.ok) throw new Error("The portfolio could not be loaded.");
    const data = await response.json();
    byId("status").textContent = data.tickets.length ? "" : "No tickets have been recorded yet.";
    byId("throughput").textContent = data.throughput;
    byId("cycle").textContent = time(data.mean_cycle_time_seconds);
    byId("reopen").textContent = data.reopen_rate == null ? "—" : `${(data.reopen_rate * 100).toFixed(0)}%`;
    const max = Math.max(1, ...Object.values(data.bottlenecks));
    Object.entries(data.bottlenecks).forEach(([status, count]) => {
      const bar = document.createElement("div");
      bar.className = "bar";
      const name = document.createElement("span");
      name.textContent = label(status);
      const progress = document.createElement("progress");
      progress.max = max; progress.value = count; progress.setAttribute("aria-label", label(status));
      const total = document.createElement("span"); total.textContent = count;
      bar.append(name, progress, total); byId("bottlenecks").append(bar);
    });
    data.sprints.forEach(sprint => row("sprints", [
      sprint.name, `${sprint.planned_start_date} to ${sprint.planned_end_date}`,
      `${sprint.completed} / ${sprint.tickets}`
    ]));
    data.tickets.forEach(ticket => row("tickets", [
      ticket.ticket_id, label(ticket.status), ticket.sprint_id ?? "Backlog",
      time(ticket.age_seconds), time(ticket.cycle_time_seconds), time(ticket.blocked_seconds)
    ]));
  } catch (error) { byId("status").textContent = error.message; }
}
load();
</script>
</body>
</html>
